<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Learning Layers</title><desc id="desc">Layered translucent cards forming a learning path</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="1" x2="1" y2="0"><stop stop-color="#07111e"/><stop offset=".52" stop-color="#0b1530"/><stop offset="1" stop-color="#201b4d"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9" stop-opacity=".24"/><stop offset="1" stop-color="#818cf8" stop-opacity=".08"/></linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#94a3b8" stroke-opacity=".06"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="35"/></filter>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/><rect width="1600" height="640" fill="url(#grid)"/>
  <circle cx="410" cy="220" r="230" fill="#22d3ee" opacity=".1" filter="url(#blur)"/><circle cx="1260" cy="420" r="260" fill="#6366f1" opacity=".14" filter="url(#blur)"/>
  <g transform="translate(310 105) rotate(-5 260 215)"><rect x="0" y="80" width="520" height="330" rx="28" fill="#0b172b" stroke="#67e8f9" stroke-opacity=".2"/><rect x="50" y="40" width="520" height="330" rx="28" fill="#0d1c35" stroke="#818cf8" stroke-opacity=".26"/><rect x="100" width="520" height="330" rx="28" fill="url(#card)" stroke="#67e8f9" stroke-opacity=".38"/>
    <g fill="#e2e8f0" opacity=".32"><rect x="150" y="62" width="230" height="8" rx="4"/><rect x="150" y="98" width="350" height="6" rx="3"/><rect x="150" y="126" width="290" height="6" rx="3"/></g>
    <g transform="translate(150 190)"><circle cx="0" cy="0" r="10" fill="#67e8f9"/><path d="M20 0h95l35 48h105l45-70h100" fill="none" stroke="url(#path)" stroke-width="4" stroke-linecap="round"/><circle cx="150" cy="48" r="9" fill="#07111e" stroke="#67e8f9" stroke-width="3"/><circle cx="300" cy="-22" r="9" fill="#07111e" stroke="#818cf8" stroke-width="3"/><circle cx="400" cy="-22" r="12" fill="#818cf8"/></g>
  </g>
  <g transform="translate(1030 115)"><circle cx="180" cy="200" r="174" fill="none" stroke="#94a3b8" stroke-opacity=".12"/><circle cx="180" cy="200" r="128" fill="none" stroke="#67e8f9" stroke-opacity=".2"/><circle cx="180" cy="200" r="82" fill="#22d3ee" opacity=".08" stroke="#67e8f9" stroke-opacity=".45"/><path d="M180 26v92M354 200h-92M180 374v-92M6 200h92" stroke="url(#path)" stroke-width="3"/><g fill="#67e8f9"><circle cx="180" cy="26" r="9"/><circle cx="354" cy="200" r="9"/><circle cx="180" cy="374" r="9"/><circle cx="6" cy="200" r="9"/></g><circle cx="180" cy="200" r="18" fill="#818cf8"/></g>
</svg>

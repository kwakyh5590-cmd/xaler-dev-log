<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" role="img" aria-labelledby="title desc">
  <title id="title">Debugging Flow</title><desc id="desc">A clean terminal flow with highlighted debugging points</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1=".2" x2="1" y2="1"><stop stop-color="#080d19"/><stop offset=".6" stop-color="#10182d"/><stop offset="1" stop-color="#10263c"/></linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#818cf8"/><stop offset=".55" stop-color="#22d3ee"/><stop offset="1" stop-color="#67e8f9" stop-opacity=".2"/></linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#cbd5e1" opacity=".08"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>
  <rect width="1600" height="640" fill="url(#bg)"/><rect width="1600" height="640" fill="url(#dots)"/>
  <ellipse cx="1280" cy="210" rx="290" ry="210" fill="#0891b2" opacity=".12" filter="url(#glow)"/>
  <g transform="translate(230 95)"><rect width="870" height="450" rx="24" fill="#07111e" stroke="#94a3b8" stroke-opacity=".24"/><path d="M0 58h870" stroke="#94a3b8" stroke-opacity=".2"/><circle cx="30" cy="29" r="6" fill="#fb7185" opacity=".75"/><circle cx="52" cy="29" r="6" fill="#fbbf24" opacity=".75"/><circle cx="74" cy="29" r="6" fill="#34d399" opacity=".75"/>
    <g fill="#64748b" opacity=".62"><rect x="40" y="98" width="120" height="7" rx="4"/><rect x="40" y="142" width="230" height="7" rx="4"/><rect x="40" y="186" width="170" height="7" rx="4"/><rect x="40" y="230" width="300" height="7" rx="4"/><rect x="40" y="274" width="210" height="7" rx="4"/><rect x="40" y="318" width="255" height="7" rx="4"/><rect x="40" y="362" width="185" height="7" rx="4"/></g>
    <g fill="#67e8f9"><rect x="190" y="98" width="155" height="7" rx="4"/><rect x="300" y="142" width="100" height="7" rx="4"/><rect x="240" y="186" width="190" height="7" rx="4"/><rect x="370" y="230" width="120" height="7" rx="4"/><rect x="280" y="274" width="220" height="7" rx="4"/></g>
    <path d="M520 115h80l42 60 70-15 55 90-78 68 42 62" fill="none" stroke="url(#pulse)" stroke-width="4" stroke-linecap="round"/><g fill="#07111e" stroke="#67e8f9" stroke-width="3"><circle cx="520" cy="115" r="8"/><circle cx="642" cy="175" r="8"/><circle cx="712" cy="160" r="8"/><circle cx="767" cy="250" r="8"/><circle cx="689" cy="318" r="8"/><circle cx="731" cy="380" r="8"/></g>
  </g>
  <g transform="translate(1160 150)"><rect width="220" height="300" rx="28" fill="#14233d" stroke="#67e8f9" stroke-opacity=".35"/><circle cx="110" cy="88" r="42" fill="#22d3ee" opacity=".12"/><path d="M90 88l14 14 30-34" fill="none" stroke="#67e8f9" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><rect x="52" y="164" width="116" height="7" rx="4" fill="#cbd5e1" opacity=".52"/><rect x="72" y="194" width="76" height="7" rx="4" fill="#818cf8" opacity=".8"/><rect x="45" y="248" width="130" height="32" rx="16" fill="#22d3ee" opacity=".13" stroke="#67e8f9" stroke-opacity=".35"/></g>
</svg>
